name: FootballHub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: uv installieren
        uses: astral-sh/setup-uv@v6

      - name: Python installieren
        run: uv python install 3.13

      - name: Dependencies installieren
        run: uv sync --frozen

      - name: Tests ausführen
        run: uv run pytest

      - name: Docker Image bauen
        run: docker build -t footballhub-backend:ci .

      - name: Bei GitHub Container Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Image für Registry bauen und hochladen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nguyenqs/footballhub:latest
            ghcr.io/nguyenqs/footballhub:${{ github.sha }}