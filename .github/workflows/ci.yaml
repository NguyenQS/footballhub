name: FootballHub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: uv installieren
        uses: astral-sh/setup-uv@v6

      - name: Python installieren
        run: uv python install 3.13

      - name: Dependencies installieren
        run: uv sync --frozen

      - name: Anwendung importieren
        run: uv run python -c "from backend.main import app; print('FootballHub import successful')"