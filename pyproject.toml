[project]
name = "footballhub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "NguyenQS", email = "uzqqk@student.kit.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
]

[project.scripts]
footballhub = "footballhub:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
